name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emanueldssss
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#e11d48&color_dots=#fff1f2,#fecdd3,#fda4af,#fb7185,#e11d48
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#fb7185&color_dots=#16090d,#3f101c,#7f1d1d,#be123c,#fb7185

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
