name: Generate Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/main.yml"

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: emanueldssss
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff4fd8&color_dots=#f8fafc,#fce7f3,#f9a8d4,#f472b6,#db2777
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff4fd8&color_dots=#161b22,#374151,#6b7280,#f9a8d4,#ff4fd8

      - name: Publish generated files
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
